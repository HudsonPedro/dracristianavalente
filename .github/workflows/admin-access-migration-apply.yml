name: Admin Access Migration Apply

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply admin access migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate DATABASE_URL secret
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERRO: DATABASE_URL não configurada no GitHub Actions."
            exit 1
          fi

          echo "DATABASE_URL disponível para migration."

      - name: Apply Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec drizzle-kit migrate

      - name: Confirm migration command completed
        shell: bash
        run: |
          echo "Migration administrativa aplicada com sucesso."
