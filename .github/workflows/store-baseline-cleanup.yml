name: Store Baseline Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Synchronize pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TanStack route tree
        run: pnpm exec vite build

      - name: Validate TypeScript
        run: pnpm exec tsc --noEmit --pretty false

      - name: Validate production build
        run: pnpm run build

      - name: Commit synchronized pnpm lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml já está sincronizado."
          else
            git commit -m "fix(store): synchronize pnpm lockfile"
            git push origin main
          fi
