name: Admin Access Migration Generate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate admin access migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: >
          pnpm exec drizzle-kit generate
          --config=drizzle.generate.config.ts
          --name=admin_identity_access

      - name: Show generated files
        shell: bash
        run: |
          echo "Arquivos alterados:"
          git status --short

          echo ""
          echo "Arquivos dentro de drizzle/:"
          find drizzle -maxdepth 2 -type f | sort

      - name: Validate migration was generated
        shell: bash
        run: |
          if git diff --quiet -- drizzle; then
            echo "ERRO: nenhuma alteração foi gerada dentro de drizzle/."
            exit 1
          fi

          echo "Migration gerada pelo Drizzle com sucesso."

      - name: Validate admin tables exist in generated migration
        shell: bash
        run: |
          GENERATED_SQL="$(git diff --name-only -- drizzle | grep '\.sql$' | tail -n 1)"

          if [ -z "$GENERATED_SQL" ]; then
            echo "ERRO: arquivo SQL de migration não encontrado."
            exit 1
          fi

          echo "Migration SQL encontrada:"
          echo "$GENERATED_SQL"

          grep -q 'CREATE TABLE "admin_roles"' "$GENERATED_SQL" || {
            echo 'ERRO: admin_roles não encontrada na migration.'
            exit 1
          }

          grep -q 'CREATE TABLE "admin_role_permissions"' "$GENERATED_SQL" || {
            echo 'ERRO: admin_role_permissions não encontrada na migration.'
            exit 1
          }

          grep -q 'CREATE TABLE "admin_users"' "$GENERATED_SQL" || {
            echo 'ERRO: admin_users não encontrada na migration.'
            exit 1
          }

          echo "As 3 tabelas administrativas foram encontradas."

      - name: Protect unrelated files
        shell: bash
        run: |
          UNEXPECTED="$(git status --short | grep -vE '^[ MARC?D]{2} drizzle/' || true)"

          if [ -n "$UNEXPECTED" ]; then
            echo "ERRO: foram encontrados arquivos alterados fora de drizzle/:"
            echo "$UNEXPECTED"
            exit 1
          fi

          echo "Somente drizzle/ foi alterado."

      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add drizzle/

          git commit -m "feat(admin): generate identity access migration"

          git push origin HEAD:main
