name: Admin Access Migration Generate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate admin access migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: >
          pnpm exec drizzle-kit generate
          --config=drizzle.generate.config.ts
          --name=admin_identity_access

      - name: Show generated files
        shell: bash
        run: |
          echo "=================================================="
          echo "ARQUIVOS ALTERADOS / CRIADOS"
          echo "=================================================="

          git status --porcelain --untracked-files=all

          echo ""
          echo "=================================================="
          echo "ARQUIVOS ATUAIS EM drizzle/"
          echo "=================================================="

          find drizzle -maxdepth 2 -type f | sort

      - name: Validate migration was generated
        shell: bash
        run: |
          CHANGED_DRIZZLE_FILES="$(
            git status --porcelain --untracked-files=all -- drizzle
          )"

          if [ -z "$CHANGED_DRIZZLE_FILES" ]; then
            echo "ERRO: o Drizzle não gerou nenhuma alteração em drizzle/."
            exit 1
          fi

          echo "Alterações do Drizzle detectadas:"
          echo "$CHANGED_DRIZZLE_FILES"

      - name: Locate generated migration SQL
        id: migration
        shell: bash
        run: |
          GENERATED_SQL="$(
            git status --porcelain --untracked-files=all -- drizzle \
              | sed -E 's/^.. //' \
              | grep -E '^drizzle/[^/]+\.sql$' \
              | tail -n 1
          )"

          if [ -z "$GENERATED_SQL" ]; then
            echo "ERRO: nenhum novo arquivo SQL foi encontrado em drizzle/."
            echo ""
            echo "Estado atual:"
            git status --porcelain --untracked-files=all -- drizzle
            exit 1
          fi

          if [ ! -f "$GENERATED_SQL" ]; then
            echo "ERRO: o arquivo informado não existe:"
            echo "$GENERATED_SQL"
            exit 1
          fi

          echo "Migration SQL encontrada:"
          echo "$GENERATED_SQL"

          echo "sql_file=$GENERATED_SQL" >> "$GITHUB_OUTPUT"

      - name: Validate admin tables exist in generated migration
        shell: bash
        env:
          GENERATED_SQL: ${{ steps.migration.outputs.sql_file }}
        run: |
          echo "Validando migration:"
          echo "$GENERATED_SQL"

          grep -Fq 'CREATE TABLE "admin_roles"' "$GENERATED_SQL" || {
            echo 'ERRO: CREATE TABLE "admin_roles" não encontrado.'
            exit 1
          }

          grep -Fq 'CREATE TABLE "admin_role_permissions"' "$GENERATED_SQL" || {
            echo 'ERRO: CREATE TABLE "admin_role_permissions" não encontrado.'
            exit 1
          }

          grep -Fq 'CREATE TABLE "admin_users"' "$GENERATED_SQL" || {
            echo 'ERRO: CREATE TABLE "admin_users" não encontrado.'
            exit 1
          }

          echo "OK: admin_roles encontrada."
          echo "OK: admin_role_permissions encontrada."
          echo "OK: admin_users encontrada."

      - name: Validate admin foreign keys
        shell: bash
        env:
          GENERATED_SQL: ${{ steps.migration.outputs.sql_file }}
        run: |
          grep -Fq '"admin_role_permissions"' "$GENERATED_SQL" || {
            echo "ERRO: tabela admin_role_permissions ausente."
            exit 1
          }

          grep -Fq '"role_id"' "$GENERATED_SQL" || {
            echo "ERRO: role_id não encontrado na migration."
            exit 1
          }

          grep -Fq '"admin_roles"' "$GENERATED_SQL" || {
            echo "ERRO: referência para admin_roles não encontrada."
            exit 1
          }

          echo "Referências administrativas encontradas."

      - name: Protect unrelated files
        shell: bash
        run: |
          UNEXPECTED="$(
            git status --porcelain --untracked-files=all \
              | sed -E 's/^.. //' \
              | grep -vE '^drizzle/' \
              || true
          )"

          if [ -n "$UNEXPECTED" ]; then
            echo "ERRO: arquivos fora de drizzle/ foram alterados:"
            echo "$UNEXPECTED"
            exit 1
          fi

          echo "OK: somente arquivos dentro de drizzle/ foram alterados."

      - name: Show migration SQL
        shell: bash
        env:
          GENERATED_SQL: ${{ steps.migration.outputs.sql_file }}
        run: |
          echo "=================================================="
          echo "MIGRATION GERADA"
          echo "=================================================="
          cat "$GENERATED_SQL"

      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add drizzle/

          if git diff --cached --quiet; then
            echo "ERRO: não há arquivos do Drizzle preparados para commit."
            exit 1
          fi

          git commit -m "feat(admin): generate identity access migration"

          git push origin HEAD:main
