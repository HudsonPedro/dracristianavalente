name: Admin Access Seed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    name: Seed admin roles and permissions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate DATABASE_URL
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERRO: DATABASE_URL não configurada."
            exit 1
          fi

          echo "DATABASE_URL disponível."

      - name: Execute admin access seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm dlx tsx -e "
          import { seedAdminAccess } from './src/services/auth/seed-admin-access.server.ts';

          (async () => {
            const result = await seedAdminAccess();

            console.log(
              JSON.stringify(
                result,
                null,
                2
              )
            );
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          "
