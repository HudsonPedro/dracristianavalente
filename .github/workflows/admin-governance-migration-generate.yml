name: Admin Governance Migration Generate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-admin-governance-migration:
    name: Generate admin governance migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERRO: DATABASE_URL não configurada."
            exit 1
          fi

          echo "DATABASE_URL configurada."

      - name: Generate Drizzle migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm exec drizzle-kit generate --name=admin_governance

      - name: Show generated files
        shell: bash
        run: |
          echo "Arquivos alterados após drizzle-kit generate:"
          git status --short

      - name: Detect generated SQL
        id: migration
        shell: bash
        run: |
          GENERATED_SQL="$(git status --short \
            | awk '{print $2}' \
            | grep '^drizzle/.*\.sql$' \
            | tail -n 1)"

          if [ -z "$GENERATED_SQL" ]; then
            echo "ERRO: migration SQL de governança não foi encontrada."
            echo "Arquivos atuais:"
            git status --short
            exit 1
          fi

          echo "Migration SQL encontrada:"
          echo "$GENERATED_SQL"

          echo "generated_sql=$GENERATED_SQL" >> "$GITHUB_OUTPUT"

      - name: Validate governance tables
        shell: bash
        run: |
          GENERATED_SQL="${{ steps.migration.outputs.generated_sql }}"

          echo "Validando:"
          echo "$GENERATED_SQL"

          grep -q 'CREATE TABLE "admin_departments"' "$GENERATED_SQL" || {
            echo "ERRO: admin_departments não encontrada."
            exit 1
          }

          grep -q 'CREATE TABLE "admin_user_permission_overrides"' "$GENERATED_SQL" || {
            echo "ERRO: admin_user_permission_overrides não encontrada."
            exit 1
          }

          grep -q 'CREATE TABLE "admin_user_invitations"' "$GENERATED_SQL" || {
            echo "ERRO: admin_user_invitations não encontrada."
            exit 1
          }

          grep -q 'CREATE TABLE "admin_audit_logs"' "$GENERATED_SQL" || {
            echo "ERRO: admin_audit_logs não encontrada."
            exit 1
          }

          echo "As 4 tabelas de governança foram encontradas."

      - name: Validate existing admin tables are not recreated
        shell: bash
        run: |
          GENERATED_SQL="${{ steps.migration.outputs.generated_sql }}"

          if grep -q 'CREATE TABLE "admin_users"' "$GENERATED_SQL"; then
            echo "ERRO: migration tentou recriar admin_users."
            exit 1
          fi

          if grep -q 'CREATE TABLE "admin_roles"' "$GENERATED_SQL"; then
            echo "ERRO: migration tentou recriar admin_roles."
            exit 1
          fi

          if grep -q 'CREATE TABLE "admin_role_permissions"' "$GENERATED_SQL"; then
            echo "ERRO: migration tentou recriar admin_role_permissions."
            exit 1
          fi

          if grep -q 'CREATE TABLE "admin_password_reset_tokens"' "$GENERATED_SQL"; then
            echo "ERRO: migration tentou recriar admin_password_reset_tokens."
            exit 1
          fi

          echo "Tabelas administrativas existentes preservadas."

      - name: Protect unrelated files
        shell: bash
        run: |
          UNRELATED_FILES="$(git status --short \
            | awk '{print $2}' \
            | grep -v '^drizzle/' \
            || true)"

          if [ -n "$UNRELATED_FILES" ]; then
            echo "ERRO: drizzle-kit alterou arquivos fora de drizzle/:"
            echo "$UNRELATED_FILES"
            exit 1
          fi

          echo "Nenhum arquivo fora de drizzle/ foi alterado."

      - name: Show generated migration
        shell: bash
        run: |
          GENERATED_SQL="${{ steps.migration.outputs.generated_sql }}"

          echo "=========================================="
          echo "MIGRATION GERADA"
          echo "=========================================="

          cat "$GENERATED_SQL"

      - name: Commit generated migration
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "ERRO: nenhuma alteração de migration encontrada."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add drizzle

          git commit \
            -m "feat(admin): generate governance migration"

          git push origin main
