name: Refresh vulnerable TanStack Start lockfile

on:
  push:
    branches:
      - audit/security-inventory-permissions-2026-10-10

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: audit/security-inventory-permissions-2026-10-10
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update compatible TanStack packages and lockfile
        run: pnpm update @tanstack/react-start @tanstack/react-router @tanstack/router-plugin

      - name: Commit lockfile only if changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(deps): update TanStack Start security patch"
          git push origin HEAD:audit/security-inventory-permissions-2026-10-10
