name: Admin Password Reset Migration Generate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate password reset migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate DATABASE_URL
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERRO: DATABASE_URL não configurada."
            exit 1
          fi

          echo "DATABASE_URL disponível."

      - name: Generate Drizzle migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm exec drizzle-kit generate --name=admin_password_reset_tokens

      - name: Show generated files
        shell: bash
        run: |
          echo "Arquivos alterados em drizzle:"
          git status --short -- drizzle

      - name: Detect generated SQL
        shell: bash
        run: |
          GENERATED_SQL="$(
            git status --porcelain --untracked-files=all -- drizzle \
              | awk '{print $2}' \
              | grep '^drizzle/.*\.sql$' \
              | tail -n 1
          )"

          if [ -z "$GENERATED_SQL" ]; then
            echo "ERRO: migration SQL não foi encontrada."
            echo ""
            echo "Estado atual da pasta drizzle:"
            git status --short --untracked-files=all -- drizzle
            exit 1
          fi

          if [ ! -f "$GENERATED_SQL" ]; then
            echo "ERRO: arquivo informado não existe: $GENERATED_SQL"
            exit 1
          fi

          echo "Migration SQL encontrada:"
          echo "$GENERATED_SQL"

          echo "GENERATED_SQL=$GENERATED_SQL" >> "$GITHUB_ENV"

      - name: Validate generated migration
        shell: bash
        run: |
          echo "Validando:"
          echo "$GENERATED_SQL"

          if ! grep -q 'CREATE TABLE "admin_password_reset_tokens"' "$GENERATED_SQL"; then
            echo "ERRO: CREATE TABLE admin_password_reset_tokens não encontrado."
            exit 1
          fi

          if ! grep -q '"user_id"' "$GENERATED_SQL"; then
            echo "ERRO: coluna user_id não encontrada."
            exit 1
          fi

          if ! grep -q '"token_hash"' "$GENERATED_SQL"; then
            echo "ERRO: coluna token_hash não encontrada."
            exit 1
          fi

          if ! grep -q '"expires_at"' "$GENERATED_SQL"; then
            echo "ERRO: coluna expires_at não encontrada."
            exit 1
          fi

          if ! grep -q '"used_at"' "$GENERATED_SQL"; then
            echo "ERRO: coluna used_at não encontrada."
            exit 1
          fi

          if ! grep -q '"created_at"' "$GENERATED_SQL"; then
            echo "ERRO: coluna created_at não encontrada."
            exit 1
          fi

          if ! grep -q 'REFERENCES "public"."admin_users"("id")' "$GENERATED_SQL"; then
            echo "ERRO: foreign key para admin_users não encontrada."
            exit 1
          fi

          if ! grep -q 'admin_password_reset_tokens_hash_unique' "$GENERATED_SQL"; then
            echo "ERRO: índice único do token_hash não encontrado."
            exit 1
          fi

          if ! grep -q 'admin_password_reset_tokens_user_idx' "$GENERATED_SQL"; then
            echo "ERRO: índice user_id não encontrado."
            exit 1
          fi

          if ! grep -q 'admin_password_reset_tokens_expires_idx' "$GENERATED_SQL"; then
            echo "ERRO: índice expires_at não encontrado."
            exit 1
          fi

          if grep -q 'DROP TABLE' "$GENERATED_SQL"; then
            echo "ERRO: DROP TABLE detectado."
            exit 1
          fi

          if grep -q 'DROP COLUMN' "$GENERATED_SQL"; then
            echo "ERRO: DROP COLUMN detectado."
            exit 1
          fi

          if grep -q 'ALTER TABLE "admin_users" DROP' "$GENERATED_SQL"; then
            echo "ERRO: alteração destrutiva em admin_users detectada."
            exit 1
          fi

          if grep -q 'ALTER TABLE "admin_roles" DROP' "$GENERATED_SQL"; then
            echo "ERRO: alteração destrutiva em admin_roles detectada."
            exit 1
          fi

          if grep -q 'ALTER TABLE "admin_role_permissions" DROP' "$GENERATED_SQL"; then
            echo "ERRO: alteração destrutiva em admin_role_permissions detectada."
            exit 1
          fi

          echo "Migration validada com sucesso."

      - name: Show generated migration
        shell: bash
        run: |
          echo "================ MIGRATION ================"
          cat "$GENERATED_SQL"
          echo "==========================================="

      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add drizzle

          if git diff --cached --quiet; then
            echo "ERRO: não existem arquivos da migration preparados para commit."
            exit 1
          fi

          echo "Arquivos que serão commitados:"
          git diff --cached --name-status

          git commit \
            -m "feat(admin): generate password reset migration"

          git push origin main
