name: Store Database Migrate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and create lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Generate Drizzle migration
        shell: bash
        run: |
          set -euo pipefail
          pnpm db:generate
      
          if [ ! -d "drizzle" ]; then
            echo "ERRO: pasta drizzle não foi gerada."
            exit 1
          fi
      
          if ! find drizzle -type f -name "*.sql" | grep -q .; then
            echo "ERRO: nenhuma migration SQL foi gerada."
            exit 1
          fi
      
          echo "Migration Drizzle gerada e validada."

      - name: Save lockfile and migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pnpm-lock.yaml drizzle/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "chore(store): generate database migration"
            git push
          fi

      - name: Apply migrations to Neon
        run: pnpm db:migrate
